[package]
name = "iam-lab"
version = "0.1.0"
edition = "2024"
description = "Laboratório visual de Interações Atômicas e Moleculares"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui_plot = "0.34"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"

